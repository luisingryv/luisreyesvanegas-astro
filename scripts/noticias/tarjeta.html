<!doctype html>
<!-- Tarjeta de una noticia (1200 × 630): imagen de la noticia y de Open Graph.
     La genera scripts/noticias/tarjeta.mjs. Es una imagen propia: nunca la foto de otro medio. -->
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Human Sans';
        src: url('../../public/fonts/HumanSans-Regular.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Human Sans';
        src: url('../../public/fonts/HumanSans-Bold.woff2') format('woff2');
        font-weight: 700;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: 'Human Sans', sans-serif;
        color: #fff;
        background: radial-gradient(70% 110% at 82% 55%, #0a1a3f 0%, #060b1c 55%, #090812 100%);
        display: grid;
        grid-template-columns: 1fr 300px;
        align-items: center;
        gap: 48px;
        padding: 0 72px 0 88px;
        position: relative;
      }
      body::before {
        content: '';
        position: absolute;
        inset: 0 0 auto 0;
        height: 6px;
        background: #0055c2;
      }
      .texto {
        display: flex;
        flex-direction: column;
        gap: 26px;
      }
      .eyebrow {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #85d5ff;
      }
      .titulo {
        font-size: var(--tamano, 58px);
        line-height: 1.08;
        font-weight: 700;
        letter-spacing: -0.015em;
        text-wrap: balance;
      }
      .fuente {
        font-size: 24px;
        color: #c9c8ce;
      }
      .dominio {
        font-size: 22px;
        font-weight: 700;
        color: #85d5ff;
        letter-spacing: 0.02em;
      }
      img {
        width: 300px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="texto">
      <p class="eyebrow" id="eyebrow"></p>
      <p class="titulo" id="titulo"></p>
      <p class="fuente" id="fuente"></p>
      <p class="dominio">luisreyesvanegas.com</p>
    </div>
    <img src="../../src/assets/brand/logo-lr-3d-render.png" alt="" />
  </body>
</html>
