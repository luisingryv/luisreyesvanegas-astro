    en: 'How a national toll network cut its Google Cloud bill by 60%'
    pt: 'Como uma rede nacional de pedágios reduziu em 60% sua fatura do Google Cloud'
  resumen:
    es: 'La factura de Google Cloud de UTPN crecía y no estaba identificado de dónde venía el sobrecosto. Encontré que la videovigilancia 24/7 salía a internet como transmisión en vivo y cambié la forma de acceder a las cámaras. La factura pasó de US$10.000 a unos US$4.000 al mes.'
    en: "UTPN's Google Cloud bill kept growing and no one had pinpointed where the overspending came from. I found that the 24/7 video surveillance went out to the internet as a live stream, and I changed how the cameras are accessed. The bill went from US$10,000 to about US$4,000 a month."
    pt: 'A fatura do Google Cloud da UTPN crescia e não estava identificado de onde vinha o custo extra. Descobri que a videovigilância 24/7 saía para a internet como transmissão ao vivo e mudei a forma de acessar as câmeras. A fatura passou de US$10.000 para cerca de US$4.000 por mês.'
