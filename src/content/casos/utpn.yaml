        es: 'El uso de la plataforma estaba justificado, pero no estaba identificado de dónde venía el sobrecosto de la factura. Además, cerca de la mitad de la capacidad contratada estaba en uso.'
        en: "The platform's usage was justified, but no one had pinpointed where the bill's overspending came from. Also, about half of the contracted capacity was in use."
        pt: 'O uso da plataforma era justificado, mas não estava identificado de onde vinha o custo extra da fatura. Além disso, cerca de metade da capacidade contratada estava em uso.'
    - clave:
        es: 'Hallazgo'
        en: 'Finding'
        pt: 'Descoberta'
      texto:
        es: 'La videovigilancia 24/7, unos 15 TB diarios, salía a internet como transmisión en vivo. Ese tráfico de salida disparaba la factura.'
        en: 'The 24/7 video surveillance, about 15 TB a day, went out to the internet as a live stream. That egress traffic sent the bill soaring.'
        pt: 'A videovigilância 24/7, cerca de 15 TB por dia, saía para a internet como transmissão ao vivo. Esse tráfego de saída disparava a fatura.'
    - clave:
        es: 'Decisión'
        en: 'Decision'
        pt: 'Decisão'
      texto:
        es: 'Rediseñé el acceso a las cámaras para que se hiciera de forma remota, sin tráfico de salida, y ajusté la capacidad al uso real.'
        en: 'I redesigned access to the cameras so it happens remotely, with no egress traffic, and I matched capacity to actual usage.'
        pt: 'Redesenhei o acesso às câmeras para que fosse feito de forma remota, sem tráfego de saída, e ajustei a capacidade ao uso real.'
    - clave:
        es: 'Después'
        en: 'After'
        pt: 'Depois'
      texto:
        es: 'El presupuesto liberado se convirtió en un contrato de soporte de largo plazo para sostener y mejorar la infraestructura.'
        en: 'The freed-up budget became a long-term support contract to sustain and improve the infrastructure.'
        pt: 'O orçamento liberado virou um contrato de suporte de longo prazo para sustentar e melhorar a infraestrutura.'
