    es: 'Cómo Mandaos pasó de unos 2.400 a unos 70.000 pedidos al mes con iFood'
    en: 'How Mandaos went from about 2,400 to about 70,000 orders a month with iFood'
    pt: 'Como a Mandaos passou de cerca de 2.400 para cerca de 70.000 pedidos por mês com o iFood'
  resumen:
    es: 'Mandaos era una startup de logística de última milla. Como Head of Product, convertí el producto en una plataforma con una API pública. Esa API fue la base de la integración con iFood y de un salto de casi 30 veces en pedidos.'
    en: 'Mandaos was a last-mile logistics startup. As Head of Product, I turned the product into a platform with a public API. That API was the foundation of the iFood integration and of an almost 30-fold jump in orders.'
    pt: 'A Mandaos era uma startup de logística de última milha. Como Head of Product, transformei o produto em uma plataforma com uma API pública. Essa API foi a base da integração com o iFood e de um salto de quase 30 vezes nos pedidos.'
