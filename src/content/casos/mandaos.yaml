  bloques:
    - clave:
        es: 'Contexto'
        en: 'Context'
        pt: 'Contexto'
      texto:
        es: 'Mandaos era una startup de logística de última milla. Entré como desarrollador web y llegué a Head of Product, a cargo del producto y de las decisiones técnicas. El reto era pasar de un servicio de domicilios a una plataforma a la que otros negocios pudieran conectarse.'
        en: 'Mandaos was a last-mile logistics startup. I joined as a web developer and became Head of Product, in charge of the product and the technical decisions. The challenge was to go from a delivery service to a platform other businesses could connect to.'
        pt: 'A Mandaos era uma startup de logística de última milha. Entrei como desenvolvedor web e cheguei a Head of Product, responsável pelo produto e pelas decisões técnicas. O desafio era passar de um serviço de entregas para uma plataforma à qual outros negócios pudessem se conectar.'
    - clave:
        es: 'Decisión'
        en: 'Decision'
        pt: 'Decisão'
      texto:
        es: 'Diseñamos una API pública para que terceros se integraran por su cuenta y migramos la app móvil a Ionic. Farmacias y otros comercios empezaron a enviar sus pedidos directamente. Un piloto con iFood validó la API y, para soportar su demanda, aceleramos la nueva app, que pasó a llamarse Netivery.'
        en: 'We designed a public API so third parties could integrate on their own, and we migrated the mobile app to Ionic. Pharmacies and other merchants started sending their orders directly. A pilot with iFood validated the API and, to support its demand, we sped up the new app, which was renamed Netivery.'
        pt: 'Projetamos uma API pública para que terceiros se integrassem por conta própria e migramos o app móvel para Ionic. Farmácias e outros comércios começaram a enviar seus pedidos diretamente. Um piloto com o iFood validou a API e, para suportar a demanda, aceleramos o novo app, que passou a se chamar Netivery.'
    - clave:
        es: 'Lo que aprendí'
        en: 'What I learned'
        pt: 'O que aprendi'
      texto:
        es: 'Fue un resultado de todo el equipo: tecnología, operación y estrategia. Con la pandemia, la salida de iFood nos mostró el riesgo de depender de un solo cliente.'
        en: "It was a result of the whole team: technology, operations and strategy. With the pandemic, iFood's exit showed us the risk of depending on a single client."
        pt: 'Foi um resultado de toda a equipe: tecnologia, operação e estratégia. Com a pandemia, a saída do iFood nos mostrou o risco de depender de um único cliente.'
