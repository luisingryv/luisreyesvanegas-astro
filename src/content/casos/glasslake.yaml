  bloques:
    - clave:
        es: 'Contexto'
        en: 'Context'
        pt: 'Contexto'
      texto:
        es: 'Glasslake ya tenía experiencia en AWS y una cuenta en pleno crecimiento. Necesitaba robustecerla con buenas prácticas: redes seguras hacia los entornos SAP de sus clientes, orden en los accesos y control de los costos.'
        en: "Glasslake already had AWS experience and a fast-growing account. It needed to strengthen it with best practices: secure networks to its clients' SAP environments, order in access and cost control."
        pt: 'A Glasslake já tinha experiência na AWS e uma conta em pleno crescimento. Precisava fortalecê-la com boas práticas: redes seguras até os ambientes SAP dos clientes, ordem nos acessos e controle dos custos.'
    - clave:
        es: 'Decisión'
        en: 'Decision'
        pt: 'Decisão'
      texto:
        es: 'Centralicé las cuentas con AWS Organizations e IAM Identity Center: desde la cuenta principal se reparten los beneficios y programas y se manejan los pagos. Construí los entornos multitenant y las conexiones de red con Transit Gateway, VPN, endpoints y proxies hacia los clientes, y una infraestructura que crece en proporción a su costo de servicio.'
        en: 'I centralized the accounts with AWS Organizations and IAM Identity Center: benefits and programs are shared and payments are managed from the main account. I built the multitenant environments and the network connections with Transit Gateway, VPN, endpoints and proxies to the clients, and an infrastructure that grows in proportion to its cost of service.'
        pt: 'Centralizei as contas com AWS Organizations e IAM Identity Center: a partir da conta principal são distribuídos os benefícios e programas e são feitos os pagamentos. Construí os ambientes multitenant e as conexões de rede com Transit Gateway, VPN, endpoints e proxies até os clientes, e uma infraestrutura que cresce na proporção do seu custo de serviço.'
    - clave:
        es: 'Operación'
        en: 'Operations'
        pt: 'Operação'
      texto:
        es: 'Administro la cuenta: usuarios y accesos, cumplimiento de la seguridad con Amazon Inspector y monitoreo, revisión y proyección de costos, y soporte de los servicios.'
        en: 'I run the account: users and access, security compliance with Amazon Inspector and monitoring, cost review and forecasting, and service support.'
        pt: 'Administro a conta: usuários e acessos, conformidade de segurança com Amazon Inspector e monitoramento, revisão e projeção de custos, e suporte dos serviços.'
    - clave:
        es: 'Programas'
        en: 'Programs'
        pt: 'Programas'
      texto:
        es: 'Con nuestro aliado Nexa Connect, Glasslake accedió al programa MAP de AWS. Además, el equipo recibió 10 usuarios de Kiro con créditos.'
        en: 'With our partner Nexa Connect, Glasslake joined the AWS MAP program. The team also received 10 Kiro users with credits.'
        pt: 'Com nosso parceiro Nexa Connect, a Glasslake entrou no programa MAP da AWS. Além disso, a equipe recebeu 10 usuários do Kiro com créditos.'
    - clave:
        es: 'Seguridad'
        en: 'Security'
        pt: 'Segurança'
      texto:
        es: 'Preparé la evidencia técnica en la nube para sus certificaciones. Glasslake obtuvo ISO 27001 y SOC 2: es un logro del cliente, con mi contribución técnica.'
        en: "I prepared the technical cloud evidence for its certifications. Glasslake achieved ISO 27001 and SOC 2: it is the client's achievement, with my technical contribution."
        pt: 'Preparei a evidência técnica na nuvem para as certificações. A Glasslake obteve ISO 27001 e SOC 2: é uma conquista do cliente, com minha contribuição técnica.'
