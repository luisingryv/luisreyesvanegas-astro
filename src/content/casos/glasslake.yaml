  resumen:
    es: 'Glasslake es una startup de SAP de San Francisco con presencia global y una cuenta de AWS robusta, en pleno crecimiento. Como su Cloud Expert y administrador de la cuenta, me encargo de la arquitectura, las redes, la seguridad y los costos para que la infraestructura crezca con el negocio.'
    en: 'Glasslake is a San Francisco SAP startup with a global presence and a robust, fast-growing AWS account. As its Cloud Expert and account administrator, I handle architecture, networking, security and costs so the infrastructure grows with the business.'
    pt: 'A Glasslake é uma startup de SAP de São Francisco com presença global e uma conta AWS robusta, em pleno crescimento. Como seu Cloud Expert e administrador da conta, cuido da arquitetura, das redes, da segurança e dos custos para que a infraestrutura cresça com o negócio.'
