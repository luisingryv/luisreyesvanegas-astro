  pasos:
    - clave:
        es: 'Contexto'
        en: 'Context'
        pt: 'Contexto'
      texto:
        es: 'Startup de SAP de San Francisco con presencia global, en pleno crecimiento y con experiencia en AWS: una cuenta robusta que tiene que escalar sin perder seguridad.'
        en: 'A San Francisco SAP startup with a global presence, growing fast and experienced with AWS: a robust account that has to scale without losing security.'
        pt: 'Startup de SAP de São Francisco com presença global, em pleno crescimento e com experiência na AWS: uma conta robusta que precisa escalar sem perder segurança.'
    - clave:
        es: 'Hallazgo'
        en: 'Finding'
        pt: 'Descoberta'
      texto:
        es: 'Había que robustecer la cuenta con buenas prácticas: redes seguras hacia los entornos de sus clientes, orden en los accesos y control de costos.'
        en: "The account needed to be strengthened with best practices: secure networks to its clients' environments, order in access and cost control."
        pt: 'Era preciso fortalecer a conta com boas práticas: redes seguras até os ambientes dos clientes, ordem nos acessos e controle de custos.'
    - clave:
        es: 'Decisión'
        en: 'Decision'
        pt: 'Decisão'
      texto:
        es: 'Organizations e IAM Identity Center para centralizar cuentas, beneficios y pagos; entornos multitenant; Transit Gateway, VPN y endpoints; seguridad con Amazon Inspector y monitoreo; revisión y proyección de costos.'
        en: 'Organizations and IAM Identity Center to centralize accounts, benefits and payments; multitenant environments; Transit Gateway, VPN and endpoints; security with Amazon Inspector and monitoring; cost review and forecasting.'
        pt: 'Organizations e IAM Identity Center para centralizar contas, benefícios e pagamentos; ambientes multitenant; Transit Gateway, VPN e endpoints; segurança com Amazon Inspector e monitoramento; revisão e projeção de custos.'
    - clave:
        es: 'Resultado'
        en: 'Result'
        pt: 'Resultado'
      texto:
        es: 'La cuenta crece con orden: créditos del programa MAP, tráfico por NAT Gateway 75–80% menor e ISO 27001 y SOC 2 logradas por el cliente, con mi contribución técnica.'
        en: 'The account grows in order: MAP program credits, 75–80% less NAT Gateway traffic, and ISO 27001 and SOC 2 achieved by the client with my technical contribution.'
        pt: 'A conta cresce com ordem: créditos do programa MAP, tráfego pelo NAT Gateway 75–80% menor e ISO 27001 e SOC 2 conquistadas pelo cliente, com minha contribuição técnica.'
