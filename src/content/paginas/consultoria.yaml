faq:
  eyebrow:
    es: 'Preguntas frecuentes'
    en: 'Frequently asked questions'
    pt: 'Perguntas frequentes'
  titulo:
    es: 'Antes de agendar'
    en: 'Before booking'
    pt: 'Antes de agendar'
  items:
    - pregunta:
        es: '¿Con qué nubes trabajas?'
        en: 'Which clouds do you work with?'
        pt: 'Com quais nuvens você trabalha?'
      respuesta:
        es: 'AWS, Google Cloud y Azure.'
        en: 'AWS, Google Cloud and Azure.'
        pt: 'AWS, Google Cloud e Azure.'
    - pregunta:
        es: '¿En qué idiomas?'
        en: 'In which languages?'
        pt: 'Em quais idiomas?'
      respuesta:
        es: 'Español e inglés.'
        en: 'Spanish and English.'
        pt: 'Espanhol e inglês.'
    - pregunta:
        es: '¿Qué es el programa MAP y mi empresa califica?'
        en: 'What is the MAP program and does my company qualify?'
        pt: 'O que é o programa MAP e minha empresa se qualifica?'
      respuesta:
        es: 'Es el programa con el que AWS puede invertir en migraciones, previa evaluación y aprobación de tu caso: de on-premise, de otra nube o de cargas nuevas si ya estás en AWS. Lo evaluamos con Nexa Connect, partner de AWS. Todo el detalle está en la página del programa MAP.'
        en: "It's the program through which AWS can invest in migrations, after evaluating and approving your case: from on-premises, from another cloud or of new workloads if you're already on AWS. We evaluate it with Nexa Connect, an AWS partner. All the details are on the MAP program page."
        pt: 'É o programa com o qual a AWS pode investir em migrações, após avaliar e aprovar seu caso: de on-premises, de outra nuvem ou de novas cargas se você já está na AWS. Avaliamos com a Nexa Connect, parceira da AWS. Todos os detalhes estão na página do programa MAP.'
    - pregunta:
        es: '¿Cuál es la diferencia con EvolutecC?'
        en: "What's the difference with EvolutecC?"
        pt: 'Qual é a diferença em relação à EvolutecC?'
      respuesta:
        es: 'Yo diseño la arquitectura y acompaño a tu equipo. El desarrollo de software a la medida lo hace EvolutecC.'
        en: 'I design the architecture and support your team. Custom software development is done by EvolutecC.'
        pt: 'Eu projeto a arquitetura e acompanho sua equipe. O desenvolvimento de software sob medida é feito pela EvolutecC.'
    - pregunta:
        es: '¿Cómo se factura?'
        en: 'How is it invoiced?'
        pt: 'Como é faturado?'
      respuesta:
        es: 'Resido en Colombia y emito factura colombiana en la moneda de tu empresa. El pago se hace por transferencia bancaria en esa misma moneda.'
        en: "I live in Colombia and issue a Colombian invoice in your company's currency. Payment is made by bank transfer in that same currency."
        pt: 'Moro na Colômbia e emito nota fiscal colombiana na moeda da sua empresa. O pagamento é feito por transferência bancária nessa mesma moeda.'
    - pregunta:
        es: '¿Firmas contrato y acuerdo de confidencialidad?'
        en: 'Do you sign a contract and a confidentiality agreement?'
        pt: 'Você assina contrato e acordo de confidencialidade?'
      respuesta:
        es: 'Sí. El acuerdo de confidencialidad protege la información confidencial de tu empresa y no limita mi trabajo con otros clientes. Si necesitas exclusividad, la acordamos entre las partes en el contrato.'
        en: "Yes. The confidentiality agreement protects your company's confidential information and doesn't limit my work with other clients. If you need exclusivity, we agree on it in the contract."
        pt: 'Sim. O acordo de confidencialidade protege as informações confidenciais da sua empresa e não limita meu trabalho com outros clientes. Se você precisar de exclusividade, acordamos entre as partes no contrato.'
