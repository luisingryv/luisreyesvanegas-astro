faq:
  eyebrow:
    es: 'Preguntas frecuentes'
  titulo:
    es: 'Antes de agendar'
  items:
    - pregunta:
        es: '¿Con qué nubes trabajas?'
      respuesta:
        es: 'AWS, Google Cloud y Azure.'
    - pregunta:
        es: '¿En qué idiomas?'
      respuesta:
        es: 'Español e inglés.'
    - pregunta:
        es: '¿Qué es el programa MAP y mi empresa califica?'
      respuesta:
        es: 'Es el programa con el que AWS puede invertir en migraciones, previa evaluación y aprobación de tu caso: de on-premise, de otra nube o de cargas nuevas si ya estás en AWS. Lo evaluamos con Nexa Connect, partner de AWS. Todo el detalle está en la página del programa MAP.'
    - pregunta:
        es: '¿Cuál es la diferencia con EvolutecC?'
      respuesta:
        es: 'Yo diseño la arquitectura y acompaño a tu equipo. El desarrollo de software a la medida lo hace EvolutecC.'
    - pregunta:
        es: '¿Cómo se factura?'
      respuesta:
        es: 'Resido en Colombia y emito factura colombiana en la moneda de tu empresa. El pago se hace por transferencia bancaria en esa misma moneda.'
    - pregunta:
        es: '¿Firmas contrato y acuerdo de confidencialidad?'
      respuesta:
        es: 'Sí. El acuerdo de confidencialidad protege la información confidencial de tu empresa y no limita mi trabajo con otros clientes. Si necesitas exclusividad, la acordamos entre las partes en el contrato.'
