# Textos de Consultoría, tal cual el prototipo aprobado. Las 7 puertas y los casos salen de
# sus colecciones. recibido: aviso sin URL de agenda (Luis, 20 nov 2026).
hero:
  eyebrow:
    es: 'Arquitectura cloud e IA'
    en: 'Cloud and AI architecture'
    pt: 'Arquitetura cloud e IA'
  titulo:
    es: '¿Qué necesitas resolver en tu nube?'
    en: 'What do you need to solve in your cloud?'
    pt: 'O que você precisa resolver na sua nuvem?'
  texto:
    es: 'Puede ser una factura que crece más rápido que tu negocio, una infraestructura que tiene que aguantar el doble de usuarios, una migración, una certificación de seguridad o un equipo que quiere trabajar con IA. Reviso tu caso, encuentro dónde está el problema y diseño la solución contigo.'
    en: 'It may be a bill growing faster than your business, infrastructure that has to handle twice the users, a migration, a security certification or a team that wants to work with AI. I review your case, find where the problem is and design the solution with you.'
    pt: 'Pode ser uma fatura que cresce mais rápido que seu negócio, uma infraestrutura que precisa aguentar o dobro de usuários, uma migração, uma certificação de segurança ou uma equipe que quer trabalhar com IA. Reviso seu caso, encontro onde está o problema e projeto a solução com você.'
  agendar:
    es: 'Agendar sesión de arquitectura · US$450'
    en: 'Book an architecture session · US$450'
    pt: 'Agendar sessão de arquitetura · US$450'
  llamada:
    es: 'Llamada de 20 min gratis'
    en: 'Free 20-min call'
    pt: 'Chamada gratuita de 20 min'
puertas:
  eyebrow:
    es: 'Elige tu misión'
    en: 'Choose your mission'
    pt: 'Escolha sua missão'
  titulo:
    es: 'Siete formas de empezar'
    en: 'Seven ways to start'
    pt: 'Sete formas de começar'
  boton:
    es: 'Hablemos de tu caso'
    en: "Let's talk about your case"
    pt: 'Vamos falar do seu caso'
casos:
  eyebrow:
    es: 'Casos'
    en: 'Case studies'
    pt: 'Casos'
  titulo:
    es: 'Dos casos recientes'
    en: 'Two recent cases'
    pt: 'Dois casos recentes'
  lista:
    - 'utpn'
    - 'glasslake'
pasos:
  eyebrow:
    es: 'Cómo trabajo'
    en: 'How I work'
    pt: 'Como trabalho'
  titulo:
    es: 'Cuatro pasos'
    en: 'Four steps'
    pt: 'Quatro passos'
  items:
    - numero: '01'
      titulo:
        es: 'Diagnóstico'
        en: 'Diagnosis'
        pt: 'Diagnóstico'
      texto:
        es: 'Reviso tu cuenta y tu facturación con acceso de solo lectura y encuentro dónde está el problema o la oportunidad.'
        en: 'I review your account and billing with read-only access and find where the problem or the opportunity is.'
        pt: 'Reviso sua conta e seu faturamento com acesso somente leitura e encontro onde está o problema ou a oportunidade.'
    - numero: '02'
      titulo:
        es: 'Plan'
        en: 'Plan'
        pt: 'Plano'
      texto:
        es: 'Te entrego la arquitectura propuesta, la proyección de capacidad y costos, y el orden en que conviene hacer cada cosa.'
        en: 'I deliver the proposed architecture, the capacity and cost projection, and the order in which it makes sense to do each thing.'
        pt: 'Entrego a arquitetura proposta, a projeção de capacidade e custos, e a ordem em que convém fazer cada coisa.'
    - numero: '03'
      titulo:
        es: 'Implementación'
        en: 'Implementation'
        pt: 'Implementação'
      texto:
        es: 'Ejecuto con tu equipo o lo acompaño mientras ejecuta.'
        en: 'I execute with your team or support them while they execute.'
        pt: 'Executo com sua equipe ou a acompanho enquanto ela executa.'
    - numero: '04'
      titulo:
        es: 'Operación'
        en: 'Operations'
        pt: 'Operação'
      texto:
        es: 'Si lo necesitas, te acompaño cada mes para sostener y mejorar lo que construimos.'
        en: 'If you need it, I support you every month to sustain and improve what we built.'
        pt: 'Se precisar, acompanho você todo mês para sustentar e melhorar o que construímos.'
formas:
  eyebrow:
    es: 'Formas de trabajar'
    en: 'Ways of working'
    pt: 'Formas de trabalhar'
  titulo:
    es: 'Cómo podemos trabajar juntos'
    en: 'How we can work together'
    pt: 'Como podemos trabalhar juntos'
  items:
    - nombre:
        es: 'Auditoría de costos cloud'
        en: 'Cloud cost audit'
        pt: 'Auditoria de custos cloud'
      texto:
        es: 'Dónde se va el gasto y qué hacer para reducirlo.'
        en: 'Where the spending goes and what to do to reduce it.'
        pt: 'Para onde vai o gasto e o que fazer para reduzi-lo.'
    - nombre:
        es: 'Revisión de escalabilidad y capacidad'
        en: 'Scalability and capacity review'
        pt: 'Revisão de escalabilidade e capacidade'
      texto:
        es: 'Si tu infraestructura soporta el crecimiento que esperas.'
        en: 'Whether your infrastructure can handle the growth you expect.'
        pt: 'Se sua infraestrutura suporta o crescimento que você espera.'
    - nombre:
        es: 'Revisión de arquitectura'
        en: 'Architecture review'
        pt: 'Revisão de arquitetura'
      texto:
        es: 'Un informe priorizado con los pilares de Well-Architected.'
        en: 'A prioritized report based on the Well-Architected pillars.'
        pt: 'Um relatório priorizado com os pilares do Well-Architected.'
    - nombre:
        es: 'Evaluación de programas y créditos'
        en: 'Programs and credits assessment'
        pt: 'Avaliação de programas e créditos'
      texto:
        es: 'Qué programas de la nube te corresponden, incluido MAP.'
        en: 'Which cloud programs you qualify for, including MAP.'
        pt: 'Quais programas da nuvem correspondem a você, incluindo o MAP.'
    - nombre:
        es: 'Acompañamiento técnico ISO 27001 y SOC 2'
        en: 'Technical support for ISO 27001 and SOC 2'
        pt: 'Acompanhamento técnico ISO 27001 e SOC 2'
      texto:
        es: 'Los controles técnicos en la nube que pide la certificación.'
        en: 'The cloud technical controls the certification requires.'
        pt: 'Os controles técnicos na nuvem que a certificação exige.'
    - nombre:
        es: 'Workshop de adopción de IA'
        en: 'AI adoption workshop'
        pt: 'Workshop de adoção de IA'
      texto:
        es: 'Tu equipo aprende a trabajar con Claude en su día a día.'
        en: 'Your team learns to work with Claude day to day.'
        pt: 'Sua equipe aprende a trabalhar com o Claude no dia a dia.'
    - nombre:
        es: 'Programa de adopción de IA con Claude'
        en: 'AI adoption program with Claude'
        pt: 'Programa de adoção de IA com Claude'
      texto:
        es: 'Adopción por equipos, con acompañamiento.'
        en: 'Team-by-team adoption, with support.'
        pt: 'Adoção por equipes, com acompanhamento.'
    - nombre:
        es: 'Agentes para trabajos específicos'
        en: 'Agents for specific jobs'
        pt: 'Agentes para trabalhos específicos'
      texto:
        es: 'Agentes a la medida cuando un proceso lo justifica.'
        en: 'Custom agents when a process justifies it.'
        pt: 'Agentes sob medida quando um processo justifica.'
    - nombre:
        es: 'Acompañamiento mensual'
        en: 'Monthly support'
        pt: 'Acompanhamento mensal'
      texto:
        es: 'Un arquitecto de cabecera para tu equipo, con dedicación acordada.'
        en: 'A go-to architect for your team, with an agreed time commitment.'
        pt: 'Um arquiteto de confiança para sua equipe, com dedicação acordada.'
  nota:
    es: 'Todo empieza con la sesión de arquitectura: 90 minutos y un memo con recomendaciones en 48 horas, por US$450. Después definimos juntos la forma de trabajo que le sirve a tu caso.'
    en: 'Everything starts with the architecture session: 90 minutes and a memo with recommendations within 48 hours, for US$450. Then we define together the way of working that fits your case.'
    pt: 'Tudo começa com a sessão de arquitetura: 90 minutos e um memorando com recomendações em 48 horas, por US$450. Depois definimos juntos a forma de trabalho que serve para o seu caso.'
  enlaces:
    - texto:
        es: 'Cómo funciona la sesión'
        en: 'How the session works'
        pt: 'Como funciona a sessão'
      destino:
        ruta: 'sesionArquitectura'
    - texto:
        es: 'Acompañamiento mensual'
        en: 'Monthly support'
        pt: 'Acompanhamento mensal'
      destino:
        ruta: 'retainers'
