# Textos de Charlas (speaker kit, prototipo aprobado). Los eventos salen de la colección de
# charlas. Luis aprobó el 20 nov 2026 lo que no estaba en el prototipo: la foto del hero, los
# textos del mapa (pieza 10, solo Barranquilla, Quito y Lima), masEventos, pausar y recibido.
# Los testimonios de ejemplo no se publican; el one-sheet en PDF queda pendiente.
hero:
  eyebrow:
    es: 'Charlas, talleres y paneles'
    en: 'Talks, workshops and panels'
    pt: 'Palestras, workshops e painéis'
  titulo:
    es: 'Charlas de tecnología, IA y liderazgo, preparadas para tu audiencia.'
    en: 'Talks on technology, AI and leadership, tailored to your audience.'
    pt: 'Palestras de tecnologia, IA e liderança, preparadas para o seu público.'
  texto:
    es: 'Hablo de lo que hago todos los días: arquitectura en la nube, seguridad, migración, adopción de IA con Claude y cómo liderar equipos de tecnología. Preparo cada charla según el evento y quién lo escucha, a partir de proyectos reales, para que tu audiencia salga con pasos que pueda aplicar.'
    en: "I talk about what I do every day: cloud architecture, security, migration, AI adoption with Claude and how to lead technology teams. I tailor each talk to the event and who's listening, based on real projects, so your audience leaves with steps they can apply."
    pt: 'Falo do que faço todos os dias: arquitetura em nuvem, segurança, migração, adoção de IA com o Claude e como liderar equipes de tecnologia. Preparo cada palestra conforme o evento e quem vai ouvir, a partir de projetos reais, para que seu público saia com passos que possa aplicar.'
  invitar:
    es: 'Invitarme a hablar'
    en: 'Invite me to speak'
    pt: 'Convide-me para falar'
  copiarBio:
    es: 'Copiar mi bio'
    en: 'Copy my bio'
    pt: 'Copiar minha bio'
  foto: ../../assets/prensa/charla_2025-09-20_techcaribe-fest-2025_luis-reyes-vanegas_003.jpg
  fotoAlt:
    es: 'Luis Reyes en el escenario de TechCaribe Fest 2025'
    en: 'Luis Reyes on stage at TechCaribe Fest 2025'
    pt: 'Luis Reyes no palco da TechCaribe Fest 2025'
escenario:
  eyebrow:
    es: 'En escenario'
    en: 'On stage'
    pt: 'No palco'
  titulo:
    es: 'Algunos de los eventos en los que he hablado'
    en: "Some of the events where I've spoken"
    pt: 'Alguns dos eventos em que já falei'
  verTodos:
    es: 'Ver todos los eventos'
    en: 'See all events'
    pt: 'Ver todos os eventos'
  mapa:
    eyebrow:
      es: 'He hablado en'
      en: "I've spoken in"
      pt: 'Já falei em'
    titulo:
      es: 'Charlas en tres países'
      en: 'Talks in three countries'
      pt: 'Palestras em três países'
    resumen:
      es: '{paises} países · {ciudades} ciudades · {eventos} eventos · 700+ asistentes en DevFest Ecuador'
      en: '{paises} countries · {ciudades} cities · {eventos} events · 700+ attendees at DevFest Ecuador'
      pt: '{paises} países · {ciudades} cidades · {eventos} eventos · 700+ participantes no DevFest Ecuador'
    ecuador:
      es: 'Línea ecuatorial · 0°'
      en: 'Equator · 0°'
      pt: 'Linha do Equador · 0°'
    ciudades:
      barranquilla:
        nombre:
          es: 'Barranquilla'
          en: 'Barranquilla'
          pt: 'Barranquilla'
        pais:
          es: 'Colombia'
          en: 'Colombia'
          pt: 'Colômbia'
      quito:
        nombre:
          es: 'Quito'
          en: 'Quito'
          pt: 'Quito'
        pais:
          es: 'Ecuador'
          en: 'Ecuador'
          pt: 'Equador'
      lima:
        nombre:
          es: 'Lima'
          en: 'Lima'
          pt: 'Lima'
        pais:
          es: 'Perú'
          en: 'Peru'
          pt: 'Peru'
    masEventos:
      es: 'Y {n} más en Eventos'
      en: 'And {n} more in Events'
      pt: 'E mais {n} em Eventos'
tematicas:
  eyebrow:
    es: 'Temáticas'
    en: 'Topics'
    pt: 'Temas'
  titulo:
    es: 'Preparo cada charla para tu evento.'
    en: 'I tailor every talk to your event.'
    pt: 'Preparo cada palestra para o seu evento.'
  texto:
    es: 'No llevo una charla de catálogo. Con lo que me cuentes del evento y de tu audiencia elijo el tema y el enfoque. Estas son algunas de las temáticas sobre las que hablo:'
    en: "I don't bring an off-the-shelf talk. Based on what you tell me about the event and your audience, I choose the topic and the angle. These are some of the topics I speak about:"
    pt: 'Não levo uma palestra de catálogo. Com o que você me contar do evento e do seu público, escolho o tema e o enfoque. Estes são alguns dos temas sobre os quais falo:'
  filaA:
    - es: 'Adopción de IA con Claude'
      en: 'AI adoption with Claude'
      pt: 'Adoção de IA com Claude'
    - es: 'Seguridad y cumplimiento en la nube'
      en: 'Cloud security and compliance'
      pt: 'Segurança e conformidade na nuvem'
    - es: 'Migración a la nube'
      en: 'Cloud migration'
      pt: 'Migração para a nuvem'
    - es: 'Modernización de aplicaciones'
      en: 'Application modernization'
      pt: 'Modernização de aplicações'
    - es: 'Arquitectura en AWS'
      en: 'AWS architecture'
      pt: 'Arquitetura na AWS'
    - es: 'Optimización de costos cloud'
      en: 'Cloud cost optimization'
      pt: 'Otimização de custos cloud'
    - es: 'Agentes de IA'
      en: 'AI agents'
      pt: 'Agentes de IA'
  filaB:
    - es: 'Liderazgo de equipos de tecnología'
      en: 'Leading technology teams'
      pt: 'Liderança de equipes de tecnologia'
    - es: 'Escalar la infraestructura'
      en: 'Scaling infrastructure'
      pt: 'Escalar a infraestrutura'
    - es: 'Infraestructura como código'
      en: 'Infrastructure as code'
      pt: 'Infraestrutura como código'
    - es: 'Desarrollo de software con IA'
      en: 'Software development with AI'
      pt: 'Desenvolvimento de software com IA'
    - es: 'Producto y emprendimiento'
      en: 'Product and entrepreneurship'
      pt: 'Produto e empreendedorismo'
    - es: 'Google Cloud y multinube'
      en: 'Google Cloud and multicloud'
      pt: 'Google Cloud e multicloud'
    - es: 'Comunidad tecnológica'
      en: 'Tech community'
      pt: 'Comunidade tecnológica'
  pasos:
    - titulo:
        es: 'Me cuentas del evento'
        en: 'You tell me about the event'
        pt: 'Você me conta sobre o evento'
      texto:
        es: 'Quiénes asisten, qué esperan llevarse y cuánto tiempo tenemos.'
        en: "Who's attending, what they hope to take away and how much time we have."
        pt: 'Quem participa, o que esperam levar e quanto tempo temos.'
    - titulo:
        es: 'Te propongo el tema'
        en: 'I propose the topic'
        pt: 'Proponho o tema'
      texto:
        es: 'Un título y un enfoque pensados para esa audiencia, que ajustamos juntos.'
        en: 'A title and an angle designed for that audience, which we fine-tune together.'
        pt: 'Um título e um enfoque pensados para esse público, que ajustamos juntos.'
    - titulo:
        es: 'La preparo con casos reales'
        en: 'I prepare it with real cases'
        pt: 'Preparo com casos reais'
      texto:
        es: 'Proyectos en los que he trabajado y pasos concretos para aplicar al salir.'
        en: "Projects I've worked on and concrete steps to apply afterwards."
        pt: 'Projetos em que trabalhei e passos concretos para aplicar depois.'
  pausar:
    es: 'Pausar la cinta'
    en: 'Pause the ticker'
    pt: 'Pausar a faixa'
bio:
  eyebrow:
    es: 'Bio para organizadores'
    en: 'Bio for organizers'
    pt: 'Bio para organizadores'
  titulo:
    es: 'Mi bio, en tres largos'
    en: 'My bio, in three lengths'
    pt: 'Minha bio, em três tamanhos'
formatos:
  eyebrow:
    es: 'Formatos'
    en: 'Formats'
    pt: 'Formatos'
  titulo:
    es: 'Cómo puedo participar'
    en: 'How I can take part'
    pt: 'Como posso participar'
  lista:
    - nombre:
        es: 'Keynote'
        en: 'Keynote'
        pt: 'Keynote'
      texto:
        es: 'La charla principal del evento, de 30 a 45 minutos, para todo el público.'
        en: "The event's main talk, 30 to 45 minutes, for the whole audience."
        pt: 'A palestra principal do evento, de 30 a 45 minutos, para todo o público.'
    - nombre:
        es: 'Conferencia'
        en: 'Conference'
        pt: 'Conferência'
      texto:
        es: 'Una charla de 30 a 60 minutos dentro de la agenda, sobre un tema técnico o de negocio.'
        en: 'A 30- to 60-minute talk within the agenda, on a technical or business topic.'
        pt: 'Uma palestra de 30 a 60 minutos dentro da programação, sobre um tema técnico ou de negócio.'
    - nombre:
        es: 'Workshop'
        en: 'Workshop'
        pt: 'Workshop'
      texto:
        es: 'Sesión práctica de 2 a 4 horas en la que los asistentes construyen algo.'
        en: 'A 2- to 4-hour hands-on session where attendees build something.'
        pt: 'Sessão prática de 2 a 4 horas em que os participantes constroem algo.'
    - nombre:
        es: 'Panel'
        en: 'Panel'
        pt: 'Painel'
      texto:
        es: 'Conversación con otros invitados sobre nube, IA o emprendimiento.'
        en: 'A conversation with other guests on cloud, AI or entrepreneurship.'
        pt: 'Conversa com outros convidados sobre nuvem, IA ou empreendedorismo.'
  honorarios:
    es: 'Los honorarios dependen del formato, la fecha y la ciudad. Te los comparto cuando me cuentes del evento.'
    en: "Fees depend on the format, the date and the city. I'll share them when you tell me about the event."
    pt: 'Os honorários dependem do formato, da data e da cidade. Compartilho quando você me contar sobre o evento.'
  riderEyebrow:
    es: 'Lo que necesito'
    en: 'What I need'
    pt: 'O que preciso'
  riderTitulo:
    es: 'Rider técnico'
    en: 'Technical rider'
    pt: 'Rider técnico'
  rider:
    - es: 'Proyector o pantalla con entrada HDMI'
      en: 'Projector or screen with HDMI input'
      pt: 'Projetor ou tela com entrada HDMI'
    - es: 'Micrófono inalámbrico o de solapa'
      en: 'Wireless or lavalier microphone'
      pt: 'Microfone sem fio ou de lapela'
    - es: 'Conexión a internet estable para demos'
      en: 'Stable internet connection for demos'
      pt: 'Conexão estável com a internet para demos'
    - es: 'Agua en el escenario'
      en: 'Water on stage'
      pt: 'Água no palco'
invitar:
  eyebrow:
    es: 'Invitación'
    en: 'Invitation'
    pt: 'Convite'
  titulo:
    es: 'Cuéntame de tu evento.'
    en: 'Tell me about your event.'
    pt: 'Conte-me sobre o seu evento.'
  texto:
    es: 'Con la fecha, la ciudad y el público te digo si puedo ir y qué tema le sirve más a tu audiencia.'
    en: "With the date, the city and the audience, I'll tell you whether I can attend and which topic will serve your audience best."
    pt: 'Com a data, a cidade e o público, digo se posso ir e qual tema serve mais ao seu público.'
  campos:
    evento:
      es: 'Nombre del evento'
      en: 'Event name'
      pt: 'Nome do evento'
    fecha:
      es: 'Fecha'
      en: 'Date'
      pt: 'Data'
    ciudad:
      es: 'Ciudad o en línea'
      en: 'City or online'
      pt: 'Cidade ou online'
    audiencia:
      es: 'Audiencia'
      en: 'Audience'
      pt: 'Público'
    audienciaEjemplo:
      es: 'Quiénes asisten y cuántas personas'
      en: 'Who attends and how many people'
      pt: 'Quem participa e quantas pessoas'
    presupuesto:
      es: 'Presupuesto para la charla'
      en: 'Budget for the talk'
      pt: 'Orçamento para a palestra'
    correo:
      es: 'Correo'
      en: 'Email'
      pt: 'E-mail'
  presupuestos:
    - valor: 'con-presupuesto'
      texto:
        es: 'Tenemos presupuesto'
        en: 'We have a budget'
        pt: 'Temos orçamento'
    - valor: 'viaje-y-alojamiento'
      texto:
        es: 'Cubrimos viaje y alojamiento'
        en: 'We cover travel and lodging'
        pt: 'Cobrimos viagem e hospedagem'
    - valor: 'comunidad'
      texto:
        es: 'Evento de comunidad sin presupuesto'
        en: 'Community event without a budget'
        pt: 'Evento de comunidade sem orçamento'
  enviar:
    es: 'Enviar invitación'
    en: 'Send invitation'
    pt: 'Enviar convite'
  recibido:
    es: 'Gracias. Recibí tu invitación y te respondo pronto.'
    en: 'Thank you. I got your invitation and will reply soon.'
    pt: 'Obrigado. Recebi seu convite e respondo em breve.'
