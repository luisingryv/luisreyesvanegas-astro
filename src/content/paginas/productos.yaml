# Textos de Productos (prototipo aprobado). La medalla es la pieza 05 (diseño propio, sin logos de
# terceros). Luis aprobó el 20 nov 2026 los mensajes de la conversación (demostración, sin datos
# de clientes), "Solicitar demo" hacia Contacto y recibido. El video demo y la foto de Luis y
# Andrés están pendientes: no se muestran espacios vacíos.
hero:
  eyebrow:
    es: 'Producto destacado · Trama AI'
    en: 'Featured product · Trama AI'
    pt: 'Produto em destaque · Trama AI'
  titulo:
    es: 'Agentes de IA que operan el inventario de tu empresa.'
    en: "AI agents that run your company's inventory."
    pt: 'Agentes de IA que operam o estoque da sua empresa.'
  texto:
    es: 'Trama es un agente en WhatsApp que lleva el inventario y la operación de empresas textiles medianas: entradas, salidas, contabilidad y nómina en un solo flujo.'
    en: 'Trama is a WhatsApp agent that runs the inventory and operations of mid-sized textile companies: stock in, stock out, accounting and payroll in a single flow.'
    pt: 'A Trama é um agente no WhatsApp que cuida do estoque e da operação de empresas têxteis de médio porte: entradas, saídas, contabilidade e folha de pagamento em um só fluxo.'
  equipo:
    es: 'Hecho por Trama AI, Corp. · Luis Reyes Vanegas (CEO), Gianfranco Castro (CTO), Johan Burgos (DevOps) y Najem Nabhan (PM)'
    en: 'Made by Trama AI, Corp. · Luis Reyes Vanegas (CEO), Gianfranco Castro (CTO), Johan Burgos (DevOps) and Najem Nabhan (PM)'
    pt: 'Feito pela Trama AI, Corp. · Luis Reyes Vanegas (CEO), Gianfranco Castro (CTO), Johan Burgos (DevOps) e Najem Nabhan (PM)'
  verDemo:
    es: 'Ver demo'
    en: 'See demo'
    pt: 'Ver demo'
  inversionista:
    es: 'Soy inversionista'
    en: "I'm an investor"
    pt: 'Sou investidor'
  medalla:
    etiqueta:
      es: 'Medalla: ganador de categoría, Small Business Services, Build with Gemini XPRIZE 2026'
      en: 'Medal: category winner, Small Business Services, Build with Gemini XPRIZE 2026'
      pt: 'Medalha: vencedor de categoria, Small Business Services, Build with Gemini XPRIZE 2026'
    frente:
      rotulo:
        es: 'Ganador de categoría'
        en: 'Category winner'
        pt: 'Vencedor de categoria'
      linea1:
        es: 'Small Business'
        en: 'Small Business'
        pt: 'Small Business'
      linea2:
        es: 'Services'
        en: 'Services'
        pt: 'Services'
