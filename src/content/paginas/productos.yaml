juntos:
  eyebrow:
    es: 'Construimos juntos'
    en: 'Building together'
    pt: 'Construímos juntos'
  titulo:
    es: 'Ya escalamos un producto antes.'
    en: "We've scaled a product before."
    pt: 'Já escalamos um produto antes.'
  texto:
    es: 'Andrés Martínez y yo trabajamos juntos en Mandaos, donde yo era Head of Product. Con la integración con iFood, la operación pasó de unos 2.400 a unos 70.000 pedidos al mes. Hoy seguimos creando productos juntos.'
    en: 'Andrés Martínez and I worked together at Mandaos, where I was Head of Product. With the iFood integration, the operation went from about 2,400 to about 70,000 orders a month. Today we keep building products together.'
    pt: 'Andrés Martínez e eu trabalhamos juntos na Mandaos, onde eu era Head of Product. Com a integração com o iFood, a operação passou de cerca de 2.400 para cerca de 70.000 pedidos por mês. Hoje continuamos criando produtos juntos.'
