        pt: 'Em créditos da AWS para migrar do Google Cloud para a AWS com o programa MAP.'
caminos:
  titulo:
    es: 'Dos formas de acercarte a Trama'
    en: 'Two ways to get to know Trama'
    pt: 'Duas formas de conhecer a Trama'
  empresas:
    eyebrow:
      es: 'Para empresas'
      en: 'For companies'
      pt: 'Para empresas'
    titulo:
      es: 'Quiero usar Trama en mi empresa'
      en: 'I want to use Trama in my company'
      pt: 'Quero usar a Trama na minha empresa'
    texto:
      es: 'Te mostramos el producto con un caso parecido al tuyo y vemos si resuelve tu operación.'
      en: "We'll show you the product with a case similar to yours and see whether it solves your operation."
      pt: 'Mostramos o produto com um caso parecido com o seu e vemos se ele resolve sua operação.'
    boton:
      es: 'Solicitar demo'
      en: 'Request a demo'
      pt: 'Solicitar demo'
    # 21 nov 2026 (Luis): la demo es un formulario y la persona elige el producto.
    campos:
      producto:
        es: '¿Qué producto quieres conocer?'
        en: 'Which product do you want to see?'
        pt: 'Qual produto você quer conhecer?'
      nombre:
        es: 'Nombre'
        en: 'Name'
        pt: 'Nome'
      empresa:
        es: 'Empresa'
        en: 'Company'
        pt: 'Empresa'
      correo:
        es: 'Correo'
        en: 'Email'
        pt: 'E-mail'
      mensaje:
        es: 'Qué quieres resolver (opcional)'
        en: 'What you want to solve (optional)'
        pt: 'O que você quer resolver (opcional)'
    productos:
      - valor: 'trama'
        texto:
          es: 'Trama AI'
          en: 'Trama AI'
          pt: 'Trama AI'
      - valor: 'ofilix'
        texto:
          es: 'Ofilix'
          en: 'Ofilix'
          pt: 'Ofilix'
      - valor: 'otro'
        texto:
          es: 'Otro producto o no estoy seguro'
          en: 'Another product, or not sure'
          pt: 'Outro produto ou não tenho certeza'
    recibido:
      es: 'Gracias. Recibí tu solicitud y te escribo para agendar la demo.'
      en: 'Thank you. I got your request and will write to you to schedule the demo.'
      pt: 'Obrigado. Recebi sua solicitação e escrevo para você para agendar a demo.'
  inversionistas:
    eyebrow:
      es: 'Para inversionistas'
      en: 'For investors'
      pt: 'Para investidores'
    titulo:
      es: 'Quiero conocer la empresa'
      en: 'I want to learn about the company'
      pt: 'Quero conhecer a empresa'
    texto:
      es: 'Trama AI es una C corp de Delaware con su tabla de capitalización definida. La estructura societaria, el pool de acciones, el runway y los ingresos recurrentes los comparto en una conversación privada.'
      en: 'Trama AI is a Delaware C corp with a defined cap table. I share the corporate structure, the stock option pool, the runway and the recurring revenue in a private conversation.'
      pt: 'A Trama AI é uma C corp de Delaware com sua tabela de capitalização definida. A estrutura societária, o pool de ações, o runway e a receita recorrente eu compartilho em uma conversa privada.'
    campos:
      tipo:
        es: 'Tipo de inversionista'
        en: 'Investor type'
        pt: 'Tipo de investidor'
      # 21 nov 2026 (Luis): nombre y teléfono para validar a la persona. El teléfono y su país
      # usan los textos comunes de src/content/formularios/general.yaml (27 nov 2026).
      nombre:
        es: 'Nombre'
        en: 'Name'
        pt: 'Nome'
      correo:
        es: 'Correo'
        en: 'Email'
        pt: 'E-mail'
    tipos:
      - valor: 'angel'
        texto:
          es: 'Ángel'
          en: 'Angel'
          pt: 'Anjo'
      - valor: 'fondo'
        texto:
          es: 'Fondo'
          en: 'Fund'
          pt: 'Fundo'
      - valor: 'family-office'
        texto:
          es: 'Family office'
          en: 'Family office'
          pt: 'Family office'
      - valor: 'socio-estrategico'
        texto:
          es: 'Socio estratégico'
          en: 'Strategic partner'
          pt: 'Sócio estratégico'
    enviar:
      es: 'Solicitar información'
      en: 'Request information'
      pt: 'Solicitar informações'
    aviso:
      es: 'Esta página es informativa y no constituye una oferta de valores.'
      en: 'This page is for information only and does not constitute an offer of securities.'
      pt: 'Esta página é informativa e não constitui uma oferta de valores mobiliários.'
    recibido:
      es: 'Gracias. Recibí tu solicitud y te escribo para agendar la conversación.'
      en: 'Thank you. I got your request and will write to you to schedule the conversation.'
      pt: 'Obrigado. Recebi sua solicitação e escrevo para você para agendar a conversa.'
