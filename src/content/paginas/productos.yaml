        es: 'Build with Gemini XPRIZE 2026'
        en: 'Build with Gemini XPRIZE 2026'
        pt: 'Build with Gemini XPRIZE 2026'
    reverso:
      rotulo:
        es: 'Logro desbloqueado'
        en: 'Achievement unlocked'
        pt: 'Conquista desbloqueada'
      nombre:
        es: 'Trama AI'
        en: 'Trama AI'
        pt: 'Trama AI'
      equipo:
        - 'Luis Reyes Vanegas'
        - 'Gianfranco Castro'
        - 'Johan Burgos'
        - 'Najem Nabhan'
