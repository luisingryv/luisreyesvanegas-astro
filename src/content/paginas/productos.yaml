funciona:
  eyebrow:
    es: 'Qué hace y cómo funciona'
    en: 'What it does and how it works'
    pt: 'O que faz e como funciona'
  titulo:
    es: 'Así funciona Trama'
    en: 'How Trama works'
    pt: 'Como a Trama funciona'
  pasos:
    - titulo:
        es: 'Tu equipo escribe por WhatsApp'
        en: 'Your team writes on WhatsApp'
        pt: 'Sua equipe escreve pelo WhatsApp'
      texto:
        es: 'Registra entradas, salidas y novedades sin aprender un sistema nuevo.'
        en: 'It logs stock in, stock out and updates without learning a new system.'
        pt: 'Registra entradas, saídas e novidades sem aprender um sistema novo.'
    - titulo:
        es: 'El agente organiza la operación'
        en: 'The agent organizes the operation'
        pt: 'O agente organiza a operação'
      texto:
        es: 'Actualiza el inventario y deja listo lo que necesitan contabilidad y nómina.'
        en: 'It updates the inventory and gets ready what accounting and payroll need.'
        pt: 'Atualiza o estoque e deixa pronto o que a contabilidade e a folha de pagamento precisam.'
    - titulo:
        es: 'La gerencia consulta en el momento'
        en: 'Management asks on the spot'
        pt: 'A gerência consulta na hora'
      texto:
        es: 'Pregunta por existencias, movimientos y pendientes, y recibe la respuesta en la misma conversación.'
        en: 'It asks about stock, movements and pending items, and gets the answer in the same conversation.'
        pt: 'Pergunta por estoques, movimentações e pendências, e recebe a resposta na mesma conversa.'
  modulos:
    - es: 'Inventario'
      en: 'Inventory'
      pt: 'Estoque'
    - es: 'Entradas y salidas'
      en: 'Stock in and out'
      pt: 'Entradas e saídas'
    - es: 'Contabilidad'
      en: 'Accounting'
      pt: 'Contabilidade'
    - es: 'Nómina'
      en: 'Payroll'
      pt: 'Folha de pagamento'
  conversacion:
    titulo:
      es: 'Trama'
      en: 'Trama'
      pt: 'Trama'
    demostracion:
      es: 'Demostración'
      en: 'Demo'
      pt: 'Demonstração'
    mensajes:
      - quien: equipo
        autor:
          es: 'Bodega'
          en: 'Warehouse'
          pt: 'Depósito'
        texto:
          es: 'Entrada: 12 rollos de denim azul.'
          en: 'Stock in: 12 rolls of blue denim.'
          pt: 'Entrada: 12 rolos de denim azul.'
      - quien: trama
        autor:
          es: 'Trama'
          en: 'Trama'
          pt: 'Trama'
        texto:
          es: 'Listo, registré los 12 rollos. En bodega hay 48 rollos de denim azul.'
          en: 'Done, I logged the 12 rolls. There are 48 rolls of blue denim in the warehouse.'
          pt: 'Pronto, registrei os 12 rolos. No depósito há 48 rolos de denim azul.'
      - quien: equipo
        autor:
          es: 'Producción'
          en: 'Production'
          pt: 'Produção'
        texto:
          es: 'Salida: 5 rollos para el corte de la orden 214.'
          en: 'Stock out: 5 rolls for cutting order 214.'
          pt: 'Saída: 5 rolos para o corte do pedido 214.'
      - quien: trama
        autor:
          es: 'Trama'
          en: 'Trama'
          pt: 'Trama'
        texto:
          es: 'Registrado. Quedan 43 rollos y la salida ya está lista para contabilidad.'
          en: 'Logged. 43 rolls left, and the stock-out is ready for accounting.'
          pt: 'Registrado. Restam 43 rolos e a saída já está pronta para a contabilidade.'
      - quien: equipo
        autor:
          es: 'Gerencia'
          en: 'Management'
          pt: 'Gerência'
        texto:
          es: '¿Qué tenemos pendiente hoy?'
          en: 'What do we have pending today?'
          pt: 'O que temos pendente hoje?'
      - quien: trama
        autor:
          es: 'Trama'
          en: 'Trama'
          pt: 'Trama'
        texto:
          es: 'Aprobar la compra de hilo y revisar la nómina del viernes.'
          en: "Approve the thread purchase and review Friday's payroll."
          pt: 'Aprovar a compra de linha e revisar a folha de pagamento de sexta-feira.'
