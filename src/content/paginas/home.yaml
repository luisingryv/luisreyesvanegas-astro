    - etiqueta:
        es: 'Productos'
        en: 'Products'
        pt: 'Produtos'
      titulo:
        es: 'Quiero ver o invertir en productos'
        en: 'I want to see or invest in products'
        pt: 'Quero ver ou investir em produtos'
      texto:
        es: 'Trama AI, la plataforma que dirijo, y los productos que construyo con mis socios.'
        en: 'Trama AI, the platform I run, and the products I build with my partners.'
        pt: 'Trama AI, a plataforma que dirijo, e os produtos que construo com meus sócios.'
      boton:
        es: 'Ver productos'
        en: 'See products'
        pt: 'Ver produtos'
      ruta: productos

