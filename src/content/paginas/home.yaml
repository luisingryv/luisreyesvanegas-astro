  tema:
    es: '¿En qué te ayudo?'
    en: 'How can I help?'
    pt: 'Como posso ajudar?'
  temas:
    - valor: consultoria
      texto:
        es: 'Consultoría cloud o IA'
        en: 'Cloud or AI consulting'
        pt: 'Consultoria cloud ou IA'
    - valor: conferencia
      texto:
        es: 'Conferencia o charla'
        en: 'Conference or talk'
        pt: 'Conferência ou palestra'
    - valor: contratacion
      texto:
        es: 'Contratación'
        en: 'Hiring'
        pt: 'Contratação'
    - valor: conversacion
      texto:
        es: 'Conversación general'
        en: 'General conversation'
        pt: 'Conversa geral'
