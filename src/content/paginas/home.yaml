# Textos del Home, tal cual el prototipo aprobado (referencia/prototipo/home.html, 20 nov 2026).
# Logros, trayectoria y charlas salen de sus colecciones.
hero:
  eyebrow:
    es: 'Arquitecto cloud · IA · CEO de Trama AI'
    en: 'Cloud architect · AI · CEO of Trama AI'
    pt: 'Arquiteto cloud · IA · CEO da Trama AI'
  titulo:
    es: 'Innovación y escalabilidad en la nube, con resultados medibles.'
    en: 'Innovation and scalability in the cloud, with measurable results.'
    pt: 'Inovação e escalabilidade na nuvem, com resultados mensuráveis.'
  bajada:
    es: 'Soy arquitecto de soluciones cloud e IA. Trabajo con empresas de Estados Unidos y Latinoamérica: entiendo qué necesita tu negocio y diseño la solución en AWS, Google Cloud o Azure.'
    en: "I'm a cloud and AI solutions architect. I work with companies in the United States and Latin America: I understand what your business needs and design the solution on AWS, Google Cloud or Azure."
    pt: 'Sou arquiteto de soluções cloud e IA. Trabalho com empresas dos Estados Unidos e da América Latina: entendo do que seu negócio precisa e projeto a solução na AWS, no Google Cloud ou no Azure.'
  premio:
    texto:
      es: 'Ganador de categoría · Build with Gemini XPRIZE 2026'
      en: 'Category winner · Build with Gemini XPRIZE 2026'
      pt: 'Vencedor de categoria · Build with Gemini XPRIZE 2026'
    url: 'https://gxp.moonshots.com/'
  agendar:
    es: 'Agendar sesión de arquitectura'
    en: 'Book an architecture session'
    pt: 'Agendar sessão de arquitetura'
  invitarme:
    es: 'Invitarme a hablar'
    en: 'Invite me to speak'
    pt: 'Convide-me para falar'
  retrato: ../../assets/fotos/retrato_sin-fecha_oficina-chaqueta-verde-home_luis-reyes-vanegas_001.jpg
  retratoAlt:
    es: 'Luis Carlos Reyes Vanegas en su oficina'
    en: 'Luis Carlos Reyes Vanegas in his office'
    pt: 'Luis Carlos Reyes Vanegas em seu escritório'

router:
