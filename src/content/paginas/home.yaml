        es: 'Necesito resolver algo en mi nube o con IA'
        en: 'I need to solve something in my cloud or with AI'
        pt: 'Preciso resolver algo na minha nuvem ou com IA'
      texto:
        es: 'Costos, crecimiento, programas de la nube, migración, buenas prácticas, seguridad o adopción de IA.'
        en: 'Costs, growth, cloud programs, migration, best practices, security or AI adoption.'
        pt: 'Custos, crescimento, programas da nuvem, migração, boas práticas, segurança ou adoção de IA.'
      boton:
        es: 'Ver consultoría'
        en: 'See consulting'
        pt: 'Ver consultoria'
