evolutecc:
  titulo:
    es: '¿Necesitas desarrollo a la medida?'
    en: 'Need custom development?'
    pt: 'Precisa de desenvolvimento sob medida?'
  texto:
    es: 'En EvolutecC, donde soy CTO, desarrollamos software a la medida para empresas. Llevamos más de 400 proyectos entregados.'
    en: "At EvolutecC, where I'm CTO, we build custom software for companies. We have delivered more than 400 projects."
    pt: 'Na EvolutecC, onde sou CTO, desenvolvemos software sob medida para empresas. Já entregamos mais de 400 projetos.'
  boton:
    es: 'Conoce EvolutecC'
    en: 'Discover EvolutecC'
    pt: 'Conheça a EvolutecC'

contacto:
  eyebrow:
    es: 'Contacto'
    en: 'Contact'
    pt: 'Contato'
  titulo:
    es: 'Cuéntame qué estás construyendo.'
    en: "Tell me what you're building."
    pt: 'Conte o que você está construindo.'
  texto:
    es: 'Si tu factura de nube crece más rápido que tu negocio, si vas a migrar o si quieres que tu equipo trabaje con IA, escríbeme y lo revisamos juntos. También acepto invitaciones para dar charlas.'
    en: "If your cloud bill is growing faster than your business, if you're about to migrate or if you want your team to work with AI, write to me and we'll review it together. I also accept invitations to give talks."
    pt: 'Se sua fatura de nuvem cresce mais rápido que seu negócio, se você vai migrar ou se quer que sua equipe trabalhe com IA, escreva e revisamos juntos. Também aceito convites para dar palestras.'
