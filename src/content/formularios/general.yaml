# Textos comunes del formulario general (Home y Contacto). Cada página pone su pregunta de
# tema y sus opciones.
whatsapp:
  es: 'WhatsApp:'
  en: 'WhatsApp:'
  pt: 'WhatsApp:'
campos:
  nombre:
    es: 'Nombre'
    en: 'Name'
    pt: 'Nome'
  correo:
    es: 'Correo'
    en: 'Email'
    pt: 'E-mail'
  mensaje:
    es: 'Mensaje'
    en: 'Message'
    pt: 'Mensagem'
# Casilla de autorización (Luis, 20 nov 2026): texto del prototipo de Contacto.
autorizacion:
  antes:
    es: 'Acepto la'
    en: 'I accept the'
    pt: 'Aceito a'
  enlace:
    es: 'política de privacidad'
    en: 'privacy policy'
    pt: 'política de privacidade'
  despues:
    es: 'y el tratamiento de mis datos para responder este mensaje.'
    en: 'and the processing of my data to reply to this message.'
    pt: 'e o tratamento dos meus dados para responder a esta mensagem.'
enviar:
  es: 'Enviar'
  en: 'Send'
  pt: 'Enviar'
# Mensajes después de enviar. No están en el prototipo; Luis los aprobó el 20 nov 2026.
enviado:
  es: 'Gracias. Recibí tu mensaje y te respondo pronto.'
  en: 'Thank you. I got your message and will reply soon.'
  pt: 'Obrigado. Recebi sua mensagem e respondo em breve.'
error:
  es: 'No se pudo enviar. Revisa los campos e inténtalo de nuevo.'
  en: "It couldn't be sent. Check the fields and try again."
  pt: 'Não foi possível enviar. Revise os campos e tente novamente.'
