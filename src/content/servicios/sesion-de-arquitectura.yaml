# Subpágina de Consultoría (plantilla común). Textos tal cual el prototipo aprobado.
ruta: 'sesionArquitectura'
titulo:
  es: 'Sesión de arquitectura'
hero:
  eyebrow:
    es: 'La puerta de entrada'
  titulo:
    es: '90 minutos para saber qué hacer con tu nube.'
  texto:
    es: 'Revisamos juntos tu caso, sea cual sea la puerta por la que llegas: costos, crecimiento, programas de AWS, migración, buenas prácticas, seguridad o adopción de IA. En 48 horas recibes un memo con mis recomendaciones.'
  agendar:
    es: 'Agendar sesión de arquitectura · US$450'
  llamada:
    es: 'Llamada de 20 min gratis'
senales:
  titulo:
    es: 'Para quién es'
  items:
    - es: 'CTOs y founders que necesitan una segunda opinión antes de decidir.'
    - es: 'Gerentes de TI con una factura que no cuadra.'
    - es: 'Equipos a punto de migrar o de crecer.'
    - es: 'Empresas que quieren empezar con IA y no saben por dónde.'
    - es: 'Quien no está listo para un proyecto, pero sí para una conversación seria.'
entregables:
  eyebrow:
    es: 'Qué recibes'
  titulo:
    es: 'Sesión de arquitectura · US$450'
  items:
    - titulo:
        es: '90 minutos conmigo'
      texto:
        es: 'Por videollamada, con tu equipo técnico si quieres.'
    - titulo:
        es: 'Memo en 48 horas'
      texto:
        es: 'Hallazgos, recomendaciones priorizadas y siguientes pasos.'
    - titulo:
        es: 'Sin compromiso'
      texto:
        es: 'Con el memo puedes seguir solo, con tu equipo o conmigo.'
    - titulo:
        es: 'Acreditable'
      texto:
        es: 'Si después seguimos trabajando juntos, te descuento los US$450 del siguiente servicio.'
proceso:
  eyebrow:
    es: 'Cómo lo hago'
  titulo:
    es: 'Proceso'
  items:
    - numero: '01'
      titulo:
        es: 'Agenda'
      texto:
        es: 'Eliges fecha y hora y respondes unas preguntas sobre tu caso.'
    - numero: '02'
      titulo:
        es: 'Preparación'
      texto:
        es: 'Reviso lo que me compartes antes de la sesión.'
    - numero: '03'
      titulo:
        es: 'Sesión'
      texto:
        es: '90 minutos para entender el problema y discutir opciones.'
    - numero: '04'
      titulo:
