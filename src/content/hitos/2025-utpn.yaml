titulo:
  es: 'Optimización de Google Cloud en UTPN'
  en: 'Google Cloud optimization at UTPN'
  pt: 'Otimização do Google Cloud na UTPN'
texto:
  es: 'Audité la infraestructura de una red nacional de peajes, rediseñé el acceso a la videovigilancia y eliminé el tráfico de salida que disparaba la factura.'
  en: 'I audited the infrastructure of a national toll network, redesigned access to the video surveillance and eliminated the egress traffic that was driving up the bill.'
  pt: 'Auditei a infraestrutura de uma rede nacional de pedágios, redesenhei o acesso à videovigilância e eliminei o tráfego de saída que disparava a fatura.'
cifra:
  es: 'US$10.000 → US$4.000 al mes'
  en: 'US$10,000 → US$4,000 a month'
  pt: 'US$10.000 → US$4.000 por mês'
impacto:
  es: 'El presupuesto liberado se convirtió en un contrato de soporte de largo plazo.'
  en: 'The freed-up budget became a long-term support contract.'
  pt: 'O orçamento liberado virou um contrato de suporte de longo prazo.'
