# Calidad antes de cada despliegue: si algo falla, no se despliega.
name: Calidad

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: calidad-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Misma base que Hostinger (MariaDB 10.11) solo para las pruebas de integración.
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci
          MARIADB_DATABASE: luisreyes_test
          MARIADB_USER: luisreyes
          MARIADB_PASSWORD: ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DATABASE_URL_TEST: mysql://luisreyes:ci@127.0.0.1:3306/luisreyes_test
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Formato
        run: pnpm format:check

      - name: Pruebas unitarias
        run: pnpm test

      - name: Migraciones y pruebas de la base de datos
        run: |
          pnpm db:migrate -- --pruebas
          pnpm test:db

      # Usa el Chrome que trae ubuntu-latest; incluye axe (WCAG 2.2 AA).
      - name: Pruebas de flujos y accesibilidad
        run: pnpm test:e2e

      - name: Lighthouse (95 o más en cada categoría)
        run: pnpm lighthouse

      - name: Guardar reportes si algo falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reportes
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          retention-days: 14
